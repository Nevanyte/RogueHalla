[package]
name = "rh-policy"
description = "The policy contract: how scripted bots today and learned policies later drive a seat, live or headless."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
rh-protocol = { path = "../rh-protocol" }
rh-sim = { path = "../rh-sim" }

[lints]
workspace = true

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
# Trusted build setup (`rh_sim::trusted_build`) for the quest-decision oracle (P-RAID-Q3): it gives a seated fighter stat
# stacks the way a camp would, so a test reaches The Bargain without clearing two camps. Dev only; never a server build
# (rh-sim tests/trusted_build_feature_guard.rs reads this manifest).
rh-sim = { path = "../rh-sim", features = ["trusted-build-setup"] }
